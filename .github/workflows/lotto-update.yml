name: Update official lotto draws
on:
  schedule:
    # KST Saturday 21:40 / 22:40, Sunday 06:40; daily recovery at 07:40.
    - cron: '40 12,13 * * 6'
    - cron: '40 21 * * 6'
    - cron: '40 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lotto-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run lotto:update
      - run: npm run test:lotto
      - name: Commit verified draw snapshot
        run: |
          if git diff --quiet -- src/data/lotto-draws.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/lotto-draws.json
          git commit -m 'chore: update official lotto draw results'
          git push
