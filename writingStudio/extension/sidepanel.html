<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing Studio</title>
  <style>
    :root {
      --bg:#1a1a1a; --surface:#252525; --surface2:#2d2d2d; --gold:#edaf20;
      --gold-dim:rgba(237,175,32,.15); --gold-border:rgba(237,175,32,.3);
      --text:#e0e0e0; --dim:#888; --border:#383838; --green:#22c55e; --red:#ef4444; --radius:8px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Malgun Gothic',-apple-system,sans-serif; background:var(--bg); color:var(--text); font-size:13px; padding:14px; }
    .brand { text-align:center; margin-bottom:14px; }
    .brand .logo { font-size:28px; }
    .brand h1 { color:var(--gold); font-size:16px; font-weight:800; margin-top:2px; }
    .brand p { color:var(--dim); font-size:11px; margin-top:2px; }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px; }
    .card h2 { font-size:12px; font-weight:700; margin-bottom:9px; padding-bottom:6px; border-bottom:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:center; }
    .icon-btn { background:var(--surface2); border:1px solid var(--border); color:var(--dim); height:24px; padding:0 8px;
      border-radius:6px; font-size:11px; font-weight:600; display:inline-flex; align-items:center; gap:4px; }
    .icon-btn:hover { color:var(--gold); border-color:var(--gold-border); }
    label { display:block; font-size:11px; color:var(--dim); margin:8px 0 4px; }
    label:first-child { margin-top:0; }
    input, textarea, select {
      width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
      border-radius:var(--radius); padding:8px 10px; font-size:13px; outline:none; font-family:inherit; }
    input:focus, textarea:focus, select:focus { border-color:var(--gold-border); }
    textarea { min-height:80px; resize:vertical; line-height:1.6; }
    textarea::placeholder { color:#666; line-height:1.6; }
    select { cursor:pointer; }
    .row { display:flex; gap:6px; margin-top:9px; }
    button { border:none; border-radius:var(--radius); font-weight:700; cursor:pointer; font-family:inherit; font-size:13px; padding:9px 12px; }
    .btn-gold { background:var(--gold); color:#000; }
    .btn-gold:hover { filter:brightness(1.05); }
    .btn-ghost { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
    .btn-ghost:hover { border-color:var(--gold-border); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .full { width:100%; }
    .link { background:none; border:none; color:var(--dim); font-size:11px; cursor:pointer; padding:0; text-decoration:underline; }
    code { background:var(--surface2); padding:1px 4px; border-radius:4px; font-size:11px; }

    .status-line { display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:12px; }
    .status-line + .status-line { border-top:1px solid var(--border); }
    .status-line .k { color:var(--dim); }
    .status-line .v { font-weight:700; }
    .v.gold { color:var(--gold); }
    .badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
      background:var(--surface2); color:var(--dim); border:1px solid var(--border); }
    .badge.on { background:rgba(34,197,94,.15); color:var(--green); border-color:rgba(34,197,94,.45); }
    .badge.off { background:rgba(239,68,68,.15); color:var(--red); border-color:rgba(239,68,68,.45); }

    .hint { font-size:11px; color:var(--dim); line-height:1.6; margin-top:8px; }
    .warn { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.4); color:#fca5a5;
      border-radius:var(--radius); padding:8px 10px; font-size:11px; line-height:1.6; margin-top:8px; }
    .ok { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.4); color:#86efac;
      border-radius:var(--radius); padding:8px 10px; font-size:11px; line-height:1.6; margin-top:8px; }
    .preview { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius);
      padding:10px; margin-top:9px; font-size:12px; line-height:1.7; max-height:220px; overflow:auto; }
    .preview b { color:var(--gold); }
    .spinner { display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,.3);
      border-top-color:#000; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-1px; margin-right:5px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .apikey-wrap { display:none; } .apikey-wrap.show { display:block; }
    /* API 키 입력 강조 */
    #apiKey { border:2px solid var(--gold); background:#2a2410; font-size:14px; padding:11px 12px; }
    #apiKey::placeholder { color:#b9932e; }
    #apiKey:focus { box-shadow:0 0 0 3px var(--gold-dim); }
    .key-card-hi { border-color:var(--gold-border); box-shadow:0 0 0 3px var(--gold-dim); }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo">📝</div>
    <h1>Writing Studio</h1>
    <p>네이버 블로그 AI 글쓰기</p>
  </div>

  <!-- 연결 상태 -->
  <div class="card">
    <h2><span>연결 상태</span><button class="icon-btn" id="refreshBtn"><span>↻</span> 새로고침</button></h2>
    <div class="status-line"><span class="k">네이버 로그인</span><span id="s-login">확인 중…</span></div>
    <div class="status-line"><span class="k">로그인 계정 블로그</span><span class="v gold" id="s-account">—</span></div>
    <div id="loginWarn"></div>
    <label>대상 블로그 ID (글 쓸 블로그)</label>
    <input type="text" id="blogId" placeholder="예: gsb_daejang" />
    <div class="status-line"><span class="k">계정과 일치</span><span id="s-match">—</span></div>
    <div id="matchMsg"></div>
  </div>

  <!-- API 키 -->
  <div class="card" id="keyCard">
    <h2><span>🔑 Gemini API 키</span><button class="link" id="toggleKey">변경</button></h2>
    <div id="keyStatus"></div>
    <div class="apikey-wrap" id="keyWrap">
      <label>Google AI Studio에서 무료 발급 (카드 등록 없이)</label>
      <div class="row" style="margin-top:0"><button class="btn-ghost full" id="issueKey">↗ AI Studio에서 키 발급받기</button></div>
      <input type="password" id="apiKey" placeholder="AIza… 형식의 키 붙여넣기" style="margin-top:9px" />
      <div class="row"><button class="btn-gold full" id="saveKey">키 저장</button></div>
    </div>
  </div>

  <!-- 글 생성 -->
  <div class="card">
    <h2><span>✍️ 글 생성 &amp; 채우기</span></h2>
    <label>주제</label>
    <input type="text" id="topic" placeholder="예: 초보자를 위한 가계부 쓰는 법" />
    <label>키워드 (선택, 쉼표로 구분)</label>
    <input type="text" id="keywords" placeholder="예: 가계부, 예산, 절약" />
    <label>톤 / 느낌</label>
    <select id="tone">
      <option value="친근하고 편안한">친근하게</option>
      <option value="후킹이 강하고 클릭을 부르는">후킹 강하게</option>
      <option value="부드럽고 차분한">부드럽게</option>
      <option value="여성스럽고 감성적인">여성스럽게</option>
      <option value="전문적이고 신뢰감 있는">전문적으로</option>
      <option value="유머러스하고 위트 있는">유머러스하게</option>
      <option value="감성적이고 따뜻한">감성적으로</option>
      <option value="간결하고 핵심만 담은">간결하게</option>
    </select>
    <label>내용 프롬프트 (선택)</label>
    <textarea id="prompt"></textarea>
    <div class="row"><button class="btn-gold full" id="runBtn">✨ 글 생성 → 에디터에 채우기</button></div>
    <div class="row"><button class="btn-ghost full" id="genBtn">미리보기만 (채우지 않음)</button></div>
    <div id="msg"></div>
    <div id="preview"></div>
    <div class="row" id="refillRow" style="display:none"><button class="btn-ghost full" id="refillBtn">📥 에디터에 다시 채우기</button></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
